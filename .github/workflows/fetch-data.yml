name: Fetch PR data and update gist

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Haal data op en update Gist
        uses: actions/github-script@v6
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        with:
          script: |
            const fifteenMinsAgo = new Date(Date.now() - 15 * 60000).toISOString();
            
            const prQuery = encodeURIComponent(`is:pr created:>=${fifteenMinsAgo}`);
            const prResponse = await fetch(`https://api.github.com/search/issues?q=${prQuery}`);
            const prData = await prResponse.json();
            
            const newEntry = {
              timestamp: new Date().toISOString(),
              global_prs_last_15m: prData.total_count || 0
            };
            
            console.log("Saving data:", newEntry);
            
            const gistId = process.env.GIST_ID;
            const updateRes = await fetch(`https://api.github.com/gists/${gistId}`, {
              method: 'PATCH',
              headers: {
                'Authorization': `token ${process.env.GIST_TOKEN}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                files: {
                  'tracker-data.json': {
                    content: JSON.stringify(newEntry, null, 2)
                  }
                }
              })
            });
            
            if (!updateRes.ok) {
              throw new Error(`Gist update failed: ${await updateRes.text()}`);
            } else {
              console.log("Gist update completed");
            }